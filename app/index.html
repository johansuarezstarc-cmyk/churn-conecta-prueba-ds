<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModelBot: guía del modelo de churn Conecta+</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="fondo" aria-hidden="true"><i class="curva c1"></i><i class="curva c2"></i><i class="curva c3"></i><i class="p1"></i><i class="p2"></i></div>
<main class="escena">
  <section class="personaje-zona" aria-label="Personaje ModelBot">
    <div id="personaje" class="pj" data-estado="reposo"></div>
  </section>

  <section class="panel" aria-label="Conversación con ModelBot">
    <header class="cabecera">
      <div class="avatar" id="avatar-cab" aria-hidden="true"></div>
      <div class="titulos">
        <h1>ModelBot</h1>
        <p>Explora, aprende y descubre insights juntos</p>
      </div>
      <div class="progreso" id="progreso" aria-live="polite">
        <span id="progreso-texto">Inicio</span>
        <button type="button" id="voz" class="btn pequeno" aria-pressed="false" hidden>Voz: apagada</button>
        <div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><i id="progreso-barra"></i></div>
      </div>
    </header>

    <div class="chat" id="chat" aria-live="polite"></div>

    <form class="entrada" id="entrada" autocomplete="off">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 21 3l-8.5 18-2.2-7.3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <input id="texto" type="text" placeholder="Selecciona una opción o escribe una palabra clave…" aria-label="Palabra clave">
      <button type="submit" class="enviar" aria-label="Enviar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </form>
  </section>
</main>
<script src="datos.js"></script>
<script src="app.js"></script>
</body>
</html>
